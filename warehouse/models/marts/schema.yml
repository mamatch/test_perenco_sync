version: 2

models:
  - name: mdm_cmms_delta
    description: "One row per MDM/CMMS platform or section, with the planned action -- the SQL twin of pipeline/pipeline/canonical.py::compute_plan()."
    columns:
      - name: code
        tests: [not_null]
      - name: action
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["CREATE", "UPDATE", "UNARCHIVE", "NOOP", "ARCHIVE", "BLOCKED"]

  - name: iot_daily_meter_candidates
    description: "One row per (asset, day): the accepted running-hours reading -- the SQL twin of the daily-selection + counter-regression logic in pipeline/pipeline/iot.py and iot_to_cmms.py."
    columns:
      - name: asset_code
        tests: [not_null]
      - name: reading_day
        tests: [not_null]
      - name: value_hours
        tests: [not_null]
