[project]
name = "perenco-sync"
version = "0.1.0"
description = "MDM <-> CMMS <-> IoT historian synchronisation (data engineering exercise)"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.3",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "requests-mock>=1.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
